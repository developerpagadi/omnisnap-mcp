name: Bug report
description: Something does not work the way it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: most first-run problems are one of three things, and
        `npx omnisnap-mcp --doctor` says which. Please run it first.

        If the extension's popup has no **Connect to AI** switch, the installed
        version predates the bridge. That is the single most common report.

  - type: input
    id: versions
    attributes:
      label: Versions
      description: From `npx omnisnap-mcp --version` and the extension's store listing.
      placeholder: omnisnap-mcp 0.2.3, extension 1.9.3, Chrome 142, macOS 15
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: AI client
      placeholder: Claude Code, Cursor, Claude Desktop
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of --doctor
      description: This is scrubbed of secrets automatically, but do check before pasting.
      render: text

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which tool you called, with what arguments, on what kind of page.
    validations:
      required: true
